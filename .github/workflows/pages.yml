# Build the data of each project and publish site/ (landing page, hail/, validation/) to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      # Texas CRC data explorer (shown under validation/explore/)
      - run: uv run python -m crc_data_explorer.build --verify
      # Texas hail risk
      - run: uv run python -m crc_lab.storm_events.build
      - run: uv run python -m crc_lab.curves.build
      # site/data/assets and site/data/hail_compare are built locally (radar pulls, bias model) and committed
      # Source validation: the page data is committed; rebuild the inventory offline so it matches the pinned crc-sdk
      - run: uv run python -m data_source_check.build
      - run: uv run python -m crc_lab.check_site
      - run: uv run python -m crc_data_explorer.check_site
      - run: uv run python -m data_source_check.check_site
      # Keep the D0 explainers at their existing Pages URL (/explainers/...)
      - run: mkdir -p site/explainers && cp docs/explainers/*.html docs/explainers/README.md site/explainers/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
