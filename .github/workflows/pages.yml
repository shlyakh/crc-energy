# Build the explorer data from CRC Open and publish site/ to GitHub Pages (E8).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run python -m crc_lab.explorer.build --verify
      - run: uv run python -m crc_lab.storm_events.build
      - run: uv run python -m crc_lab.explorer.check_site
      # Keep the D0 explainers at their existing Pages URL (/explainers/...)
      - run: mkdir -p site/explainers && cp docs/explainers/*.html docs/explainers/README.md site/explainers/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
