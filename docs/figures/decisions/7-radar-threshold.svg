<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 126" width="960" height="126" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Radar hail days per year at a point (25 km average), across plants">
<rect width="960" height="126" fill="#faf9f6"/>
<text x="12" y="20" font-size="13" font-weight="600" fill="#2a2a28">Radar hail days per year at a point (25 km average), across plants</text>
<text x="422" y="54" font-size="12" text-anchor="end" fill="#2a2a28">30 mm or more (in use)</text>
<line x1="476.2" x2="840.0" y1="50" y2="50" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="648.1" cy="50" r="5" fill="#eb6834" stroke="#faf9f6" stroke-width="2"/>
<text x="848.0" y="54" font-size="11.5" fill="#2a2a28">0.18 (0.04–0.34)</text>
<text x="422" y="82" font-size="12" text-anchor="end" fill="#2a2a28">50 mm or more</text>
<line x1="432.6" x2="496.1" y1="78" y2="78" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="454.9" cy="78" r="5" fill="#2a78d6" stroke="#faf9f6" stroke-width="2"/>
<text x="504.1" y="82" font-size="11.5" fill="#2a2a28">0.02 (0.00–0.05)</text>
<text x="430" y="118" font-size="11" fill="#7a7976">days per year: dot = median, line = 10th to 90th percentile</text>
</svg>